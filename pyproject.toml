[project]
name = "ec"
version = "0.1.0"
description = "Erosion or Coverage? Diagnosing safety failures under capability fine-tuning"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.46,<5",
    "peft>=0.13",
    "accelerate>=1.0",
    "datasets>=3.0",
    "huggingface_hub>=0.26",
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
